    <title>Sakura Supply</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var currentPath = window.location.pathname;
      var repoSegment = currentPath.split('/').filter(Boolean)[0];
      var redirectTarget = repoSegment ? ('/' + repoSegment + '/') : '/';
      window.location.replace(redirectTarget);
    </script>
